<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, follow" />
    <title>지역별 정시 대비 과외 | 검정고시</title>
    <script>
      // Old query-string URLs (detail.html?region=...&district=...&dong=...) moved to static pages.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var segments = [params.get('region'), params.get('district'), params.get('dong')].filter(Boolean).map(function (name) {
          return encodeURIComponent(name.replace(/\s+/g, '-')) + '/';
        });
        window.location.replace('./' + segments.join(''));
      })();
    </script>
  </head>
  <body>
    <p><a href="./">지역별 정시 대비 과외 보기</a></p>
  </body>
</html>
